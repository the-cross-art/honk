apiVersion: apps/v1
kind: Deployment
metadata: {name: missing-configmap, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: missing-configmap}}
  template:
    metadata: {labels: {app: missing-configmap}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 1000000"]
          envFrom: [{configMapRef: {name: app-settings}}]
