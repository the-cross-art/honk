apiVersion: apps/v1
kind: Deployment
metadata: {name: insufficient-cpu, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: insufficient-cpu}}
  template:
    metadata: {labels: {app: insufficient-cpu}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 1000000"]
          resources: {requests: {cpu: "64"}}
