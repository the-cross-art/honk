apiVersion: apps/v1
kind: Deployment
metadata: {name: run-as-non-root, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: run-as-non-root}}
  template:
    metadata: {labels: {app: run-as-non-root}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 1000000"]
          securityContext: {runAsNonRoot: true}
