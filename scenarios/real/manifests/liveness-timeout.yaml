apiVersion: apps/v1
kind: Deployment
metadata: {name: liveness-timeout, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: liveness-timeout}}
  template:
    metadata: {labels: {app: liveness-timeout}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 1000000"]
          livenessProbe:
            exec: {command: ["sh", "-c", "sleep 3"]}
            timeoutSeconds: 1
            periodSeconds: 5
            failureThreshold: 2
