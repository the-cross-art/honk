[project]
name = "honkctl"
version = "0.1.0"
description = "A guard goose for AI agents on Kubernetes: every change is dry-run, recorded and verified, and autonomy is earned from outcomes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=31.0.0",
    "mcp>=1.9",
    "pyyaml>=6.0",
]

[project.scripts]
honk = "honk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honk"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = ["honk.kube"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
